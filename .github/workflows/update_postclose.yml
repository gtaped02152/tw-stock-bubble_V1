name: Update Taiwan Stock Post-Close Data

on:
  schedule:
    # 台灣時間週一至週五 14:40 (UTC 06:40) 與 16:20 (UTC 08:20，含三大法人T86)
    - cron: '40 6 * * 1-5'
    - cron: '20 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas yfinance

      - name: Fetch real market data
        run: python scripts/update_data.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "Update post-close market data ($(date +'%Y-%m-%d'))"
          git push
