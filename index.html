<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>台股收盤資金參考（IX0001: 36,033.29）</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --card: #162036;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
    }
    header {
      background: #0b1222;
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .top-bar { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .app-title { font-size: 0.95rem; font-weight: 800; }
    .lock-pill {
      font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4);
      white-space: nowrap;
    }
    .close-box {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 8px; padding: 7px 10px; font-size: 0.82rem; font-variant-numeric: tabular-nums; gap: 6px;
    }
    .close-pts { font-size: 1.05rem; font-weight: 900; color: var(--gold); }
    .down { color: #34d399; font-weight: 700; }
    .up { color: #f87171; font-weight: 700; }
    .btn-dl {
      background: var(--card); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.45);
      padding: 4px 10px; border-radius: 6px; font-size: 0.74rem; font-weight: 700; cursor: pointer;
    }
    .main { max-width: 860px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
    .card-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .box-title { font-size: 0.94rem; font-weight: 800; }
    .box-sub { font-size: 0.72rem; color: var(--muted); }
    .canvas-wrap {
      position: relative; width: 100%; height: 320px;
      background: radial-gradient(circle at 50% 45%, #131d33 0%, #080d18 100%);
      border-radius: 9px; border: 1px solid rgba(148, 163, 184, 0.15); overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .tip {
      position: absolute; pointer-events: none; background: rgba(9, 14, 26, 0.96);
      border: 1px solid rgba(251, 191, 36, 0.5); border-radius: 8px; padding: 7px 10px;
      font-size: 0.75rem; z-index: 25; display: none; max-width: 220px;
    }
    .sector-scroll { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .sector-scroll::-webkit-scrollbar { display: none; }
    .s-btn {
      flex: 0 0 auto; background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 6px 11px; border-radius: 8px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
    }
    .s-btn.active { background: rgba(251, 191, 36, 0.18); border-color: var(--gold); color: #fde68a; }
    .stock-cards { display: flex; flex-direction: column; gap: 8px; }
    .st-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 9px;
      padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.79rem; font-variant-numeric: tabular-nums;
    }
    .st-top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .st-mid { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); }
    .f-line { display: flex; align-items: center; gap: 7px; font-size: 0.72rem; }
    .f-track { flex: 1; height: 6px; background: #0b111e; border-radius: 99px; overflow: hidden; }
    .f-big { height: 100%; background: #f43f5e; }
    .f-ret { height: 100%; background: #38bdf8; }
    .color-legend { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--muted); }
    .grad-bar {
      flex: 1; height: 8px; margin: 0 8px; border-radius: 99px;
      background: linear-gradient(90deg, #065f46 0%, #10b981 25%, #1e293b 50%, #ef4444 75%, #991b1b 100%);
    }
    .heat-list { display: flex; flex-direction: column; gap: 7px; }
    .heat-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .heat-name { width: 92px; flex: 0 0 92px; font-size: 0.77rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .heat-slots { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
    .slot-block { height: 20px; border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="top-row">
      <div class="app-title">TPE: IX0001 收盤資金參考</div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="lock-pill">2026-11-20 收盤定格</span>
        <button class="btn-dl" onclick="downloadHtml()">下載</button>
      </div>
    </div>
    <div class="close-box">
      <div>
        <span>加權收盤：</span>
        <span class="close-pts">36,033.29</span>
        <span class="down">-2,393.60 (-6.23%)</span>
      </div>
      <div style="font-size:0.72rem; color:var(--muted);">高 37,646.13 / 低 35,738.68</div>
    </div>
  </div>
</header>

<div class="main">
  <!-- 1. 四大區塊資金流向泡泡圖 -->
  <section class="card-box">
    <div>
      <div class="box-title">資金流向泡泡圖（點選泡泡看個股）</div>
      <div class="box-sub">X軸：相對平均成交偏離｜Y軸：5日-20日加速度｜圓圈：成交規模</div>
    </div>
    <div class="canvas-wrap" id="bubbleWrap">
      <canvas id="bubbleCanvas"></canvas>
      <div class="tip" id="bubbleTip"></div>
    </div>
  </section>

  <!-- 2. 點選大類看個股大戶與散戶買賣 -->
  <section class="card-box" id="stockPanel">
    <div>
      <div class="box-title">大類個股：大戶 vs 散戶買賣狀況</div>
      <div class="box-sub">點選大類切換成分股（結構示範數據，非逐筆官方推播）</div>
    </div>
    <div class="sector-scroll" id="sectorScroll"></div>
    <div class="stock-cards" id="stockCards"></div>
  </section>

  <!-- 3. 主力買超／賣超色塊 -->
  <section class="card-box">
    <div>
      <div class="box-title">主力買超／賣超色塊（每 5 分鐘一格）</div>
      <div class="box-sub">休市鎖定不跳動｜越紅買超越大、越綠賣超越大</div>
    </div>
    <div class="color-legend">
      <span>越綠＝賣超越大</span>
      <div class="grad-bar"></div>
      <span>越紅＝買超越大</span>
    </div>
    <div class="heat-list" id="heatList"></div>
  </section>

  <!-- 4. 當天收盤 (36,033.29) 與前 30 天收盤比較（含明確 XY 軸與 30D 均價線） -->
  <section class="card-box">
    <div>
      <div class="box-title">當天收盤（36,033.29）與前 30 天收盤比較</div>
      <div class="box-sub" id="thirtyInfo"></div>
    </div>
    <div class="canvas-wrap" id="thirtyWrap" style="height:260px;">
      <canvas id="thirtyCanvas"></canvas>
      <div class="tip" id="thirtyTip"></div>
    </div>
  </section>
</div>

<script>
  const CLOSE_INDEX = 36033.29;

  const SECTORS = [
    {
      id: "semi", name: "半導體", x: 155, y: -95, size: 2280, quad: "退潮/重挫承壓", color: "#64748b",
      flow5mColorScore: [20, 5, -15, -35, -55, -70, -82, -90],
      stocks: [
        { code: "2330", name: "台積電", close: 2000.0, chg: "-4.76%", amt: 1512, big: "-14,200張", retail: "+11,600張", bigPct: 32, retPct: 74 },
        { code: "2454", name: "聯發科", close: 1580.0, chg: "-5.10%", amt: 599, big: "-4,850張", retail: "+3,920張", bigPct: 35, retPct: 71 },
        { code: "3711", name: "日月光投控", close: 457.0, chg: "-9.32%", amt: 161, big: "-6,410張", retail: "+5,380張", bigPct: 28, retPct: 77 }
      ]
    },
    {
      id: "ai", name: "AI伺服器", x: 88, y: -72, size: 1120, quad: "退潮/重挫承壓", color: "#64748b",
      flow5mColorScore: [10, -10, -25, -42, -58, -68, -76, -85],
      stocks: [
        { code: "2317", name: "鴻海", close: 210.0, chg: "-4.76%", amt: 142, big: "-9,800張", retail: "+8,150張", bigPct: 34, retPct: 70 },
        { code: "2308", name: "台達電", close: 890.0, chg: "-6.20%", amt: 165, big: "-3,120張", retail: "+2,640張", bigPct: 31, retPct: 72 }
      ]
    },
    {
      id: "fin", name: "金融保險", x: -34, y: 28, size: 420, quad: "觀望/相對抗跌", color: "#38bdf8",
      flow5mColorScore: [-5, 5, 12, 18, 22, 25, 28, 30],
      stocks: [
        { code: "2881", name: "富邦金", close: 94.5, chg: "-2.15%", amt: 130, big: "-1,950張", retail: "+2,100張", bigPct: 45, retPct: 58 },
        { code: "2882", name: "國泰金", close: 71.2, chg: "-1.90%", amt: 112, big: "-1,420張", retail: "+1,560張", bigPct: 47, retPct: 56 }
      ]
    },
    {
      id: "def", name: "防禦內需", x: -55, y: 15, size: 240, quad: "觀望/防禦", color: "#38bdf8",
      flow5mColorScore: [0, 8, 15, 20, 22, 24, 26, 28],
      stocks: [
        { code: "1216", name: "統一", close: 86.4, chg: "-1.48%", amt: 78, big: "-820張", retail: "+910張", bigPct: 48, retPct: 54 },
        { code: "2912", name: "統一超", close: 278.0, chg: "-1.24%", amt: 64, big: "-540張", retail: "+620張", bigPct: 49, retPct: 53 }
      ]
    },
    {
      id: "chem", name: "塑化鋼鐵", x: -72, y: -95, size: 210, quad: "退潮", color: "#64748b",
      flow5mColorScore: [-15, -30, -45, -60, -72, -80, -88, -95],
      stocks: [
        { code: "1303", name: "南亞", close: 22.5, chg: "-9.84%", amt: 96, big: "-8,900張", retail: "+7,850張", bigPct: 25, retPct: 80 },
        { code: "2002", name: "中鋼", close: 23.4, chg: "-4.10%", amt: 72, big: "-5,400張", retail: "+4,900張", bigPct: 30, retPct: 75 }
      ]
    }
  ];

  // 近 30 個交易日收盤價序列（最後一天為 2026-11-20 收盤 36,033.29）
  const CLOSE_30D = [
    41850.0, 42120.5, 42480.0, 42910.2, 43350.8, 43820.4, 44190.0, 44650.3, 45120.7, 45480.2,
    45890.6, 46240.1, 46680.5, 47150.0, 47520.8, 47980.4, 48310.2, 48690.5, 49120.8, 49480.3,
    49850.6, 49968.92, 48920.4, 47650.1, 46380.7, 44257.15, 42943.5, 40194.91, 38426.89, CLOSE_INDEX
  ];

  let selectedId = "semi";
  let bubbleHits = [];
  let thirtyHits = [];

  function scoreToColor(score) {
    if (score >= 70) return "#dc2626";
    if (score >= 25) return "#ef4444";
    if (score > 8)   return "#f87171";
    if (score >= -8) return "#334155";
    if (score > -35) return "#34d399";
    if (score > -70) return "#10b981";
    return "#065f46";
  }

  function drawBubbles() {
    const wrap = document.getElementById("bubbleWrap");
    const canvas = document.getElementById("bubbleCanvas");
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const pad = { top: 22, right: 16, bottom: 26, left: 42 };
    const pw = w - pad.left - pad.right, ph = h - pad.top - pad.bottom;
    const minX = -100, maxX = 190, minY = -140, maxY = 140;
    const toX = v => pad.left + ((v - minX) / (maxX - minX)) * pw;
    const toY = v => pad.top + ((maxY - v) / (maxY - minY)) * ph;
    const zx = toX(0), zy = toY(0);

    ctx.fillStyle = "rgba(244, 63, 94, 0.06)"; ctx.fillRect(zx, pad.top, w - pad.right - zx, zy - pad.top);
    ctx.fillStyle = "rgba(245, 158, 11, 0.06)"; ctx.fillRect(zx, zy, w - pad.right - zx, h - pad.bottom - zy);
    ctx.fillStyle = "rgba(56, 189, 248, 0.06)"; ctx.fillRect(pad.left, pad.top, zx - pad.left, zy - pad.top);
    ctx.fillStyle = "rgba(100, 116, 139, 0.06)"; ctx.fillRect(pad.left, zy, zx - pad.left, h - pad.bottom - zy);

    // 繪製外框 XY 軸線
    ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, h - pad.bottom);
    ctx.lineTo(w - pad.right, h - pad.bottom);
    ctx.stroke();

    // 中心十字參考線
    ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(251, 191, 36, 0.5)";
    ctx.beginPath(); ctx.moveTo(zx, pad.top); ctx.lineTo(zx, h - pad.bottom); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.left, zy); ctx.lineTo(w - pad.right, zy); ctx.stroke();
    ctx.restore();

    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "right"; ctx.fillStyle = "#fb7185"; ctx.fillText("主力主動流入", w - pad.right - 6, pad.top + 13);
    ctx.fillStyle = "#fbbf24"; ctx.fillText("輪動", w - pad.right - 6, h - pad.bottom - 6);
    ctx.textAlign = "left"; ctx.fillStyle = "#38bdf8"; ctx.fillText("觀望", pad.left + 6, pad.top + 13);
    ctx.fillStyle = "#94a3b8"; ctx.fillText("退潮", pad.left + 6, h - pad.bottom - 6);

    bubbleHits = [];
    SECTORS.forEach(s => {
      const cx = toX(s.x), cy = toY(s.y);
      const r = Math.max(18, Math.min(40, Math.sqrt(s.size) * 0.78));
      const isSel = s.id === selectedId;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = s.color + "bb"; ctx.fill();
      ctx.lineWidth = isSel ? 3 : 1.4;
      ctx.strokeStyle = isSel ? "#fde047" : s.color; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "bold 10.5px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(s.name, cx, cy - 1);
      ctx.fillStyle = "#fef08a"; ctx.font = "9.5px sans-serif";
      ctx.fillText(s.size + "億", cx, cy + 11);
      bubbleHits.push({ sector: s, cx, cy, r });
    });
  }

  function renderStocks() {
    document.getElementById("sectorScroll").innerHTML = SECTORS.map(s =>
      `<button class="s-btn ${s.id === selectedId ? "active" : ""}" onclick="selectSector('${s.id}')">${s.name}</button>`
    ).join("");

    const sec = SECTORS.find(s => s.id === selectedId) || SECTORS[0];
    document.getElementById("stockCards").innerHTML = sec.stocks.map(st => {
      const isDown = st.chg.startsWith("-");
      return `
        <div class="st-item">
          <div class="st-top">
            <span>${st.code} ${st.name}</span>
            <span>${st.close.toFixed(2)} <span class="${isDown ? "down" : "up"}">${st.chg}</span></span>
          </div>
          <div class="st-mid">
            <span>成交：${st.amt}億</span>
            <span>大戶：<b class="${st.big.startsWith("+") ? "up" : "down"}">${st.big}</b></span>
            <span>散戶：<b class="${st.retail.startsWith("+") ? "up" : "down"}">${st.retail}</b></span>
          </div>
          <div class="f-line">
            <span style="width:28px;color:#fda4af;">大戶</span>
            <div class="f-track"><div class="f-big" style="width:${st.bigPct}%"></div></div>
            <span>${st.bigPct}%</span>
          </div>
          <div class="f-line">
            <span style="width:28px;color:#7dd3fc;">散戶</span>
            <div class="f-track"><div class="f-ret" style="width:${st.retPct}%"></div></div>
            <span>${st.retPct}%</span>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderColorHeatList() {
    document.getElementById("heatList").innerHTML = SECTORS.map(s => `
      <div class="heat-row" onclick="selectSector('${s.id}')">
        <div class="heat-name">${s.name}</div>
        <div class="heat-slots">
          ${s.flow5mColorScore.map(sc => `<div class="slot-block" style="background:${scoreToColor(sc)};"></div>`).join("")}
        </div>
      </div>
    `).join("");
  }

  // =========================================================================
  // 繪製當天收盤 (36,033.29) 與前 30 天收盤比較圖（完整 XY 軸 + 30D 均價）
  // =========================================================================
  function drawThirtyDay() {
    const wrap = document.getElementById("thirtyWrap");
    const canvas = document.getElementById("thirtyCanvas");
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    // 留出足夠邊距給 Y 軸指數刻度與 X 軸日期刻度
    const pad = { top: 24, right: 20, bottom: 32, left: 58 };
    const pw = w - pad.left - pad.right;
    const ph = h - pad.top - pad.bottom;

    const minV = Math.floor((Math.min(...CLOSE_30D) - 600) / 500) * 500;
    const maxV = Math.ceil((Math.max(...CLOSE_30D) + 600) / 500) * 500;
    const avg30 = CLOSE_30D.reduce((a, b) => a + b, 0) / CLOSE_30D.length;
    const diffFromAvg = CLOSE_INDEX - avg30;

    document.getElementById("thirtyInfo").textContent =
      `30D 均價：${avg30.toFixed(2)} ｜ 當天收盤：${CLOSE_INDEX.toFixed(2)}（較 30D 均價 ${diffFromAvg >= 0 ? "+" : ""}${diffFromAvg.toFixed(2)}）`;

    const toX = i => pad.left + (i / (CLOSE_30D.length - 1)) * pw;
    const toY = v => pad.top + ((maxV - v) / (maxV - minV)) * ph;

    // 1. 繪製 Y 軸刻度與水平網格線
    const ySteps = 4;
    for (let s = 0; s <= ySteps; s++) {
      const val = minV + ((maxV - minV) * s) / ySteps;
      const py = toY(val);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.left, py);
      ctx.lineTo(w - pad.right, py);
      ctx.stroke();

      ctx.fillStyle = "#94a3b8";
      ctx.font = "10.5px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(Math.round(val).toLocaleString("en-US"), pad.left - 7, py + 3.5);
    }

    // 2. 繪製 X 軸刻度與垂直參考線
    const xTicks = [0, 7, 14, 21, 29];
    xTicks.forEach(idx => {
      const px = toX(idx);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.1)";
      ctx.beginPath();
      ctx.moveTo(px, pad.top);
      ctx.lineTo(px, h - pad.bottom);
      ctx.stroke();

      ctx.fillStyle = idx === 29 ? "#fbbf24" : "#94a3b8";
      ctx.font = idx === 29 ? "bold 10.5px sans-serif" : "10.5px sans-serif";
      ctx.textAlign = "center";
      const label = idx === 29 ? "當天(11/20)" : `-${29 - idx}日`;
      ctx.fillText(label, px, h - pad.bottom + 16);
    });

    // 3. 繪製明確的實線 X 軸與 Y 軸主軸線
    ctx.strokeStyle = "rgba(203, 213, 225, 0.55)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, h - pad.bottom);     // Y 軸
    ctx.lineTo(w - pad.right, h - pad.bottom); // X 軸
    ctx.stroke();

    // 4. 繪製 30D 均價線（金色虛線 + 明確數值標註）
    const avgY = toY(avg30);
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(pad.left, avgY);
    ctx.lineTo(w - pad.right, avgY);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(pad.left + 6, avgY - 17, 128, 15);
    ctx.fillStyle = "#fde047";
    ctx.font = "bold 10.5px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`30D 均價 ${avg30.toFixed(2)}`, pad.left + 9, avgY - 6);

    // 5. 繪製 30 日收盤價折線
    ctx.beginPath();
    CLOSE_30D.forEach((v, i) => {
      const px = toX(i), py = toY(v);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // 6. 標註數據點與當天收盤高亮點
    thirtyHits = [];
    CLOSE_30D.forEach((v, i) => {
      const px = toX(i), py = toY(v);
      const isLast = i === CLOSE_30D.length - 1;

      ctx.beginPath();
      ctx.arc(px, py, isLast ? 5.5 : 2.3, 0, Math.PI * 2);
      ctx.fillStyle = isLast ? "#f43f5e" : "#7dd3fc";
      ctx.fill();

      if (isLast) {
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#fde047";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`當天收盤 ${v.toFixed(2)}`, px - 8, py - 8);
      }
      thirtyHits.push({ i, v, px, py, avg30 });
    });
  }

  function selectSector(id) {
    selectedId = id;
    drawBubbles();
    renderStocks();
  }

  function setupEvents() {
    const bCanvas = document.getElementById("bubbleCanvas"), bTip = document.getElementById("bubbleTip");
    bCanvas.addEventListener("click", e => {
      const r = bCanvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const hit = bubbleHits.slice().reverse().find(h => Math.hypot(mx - h.cx, my - h.cy) <= h.r);
      if (hit) {
        selectSector(hit.sector.id);
        bTip.style.display = "block";
        bTip.style.left = Math.min(r.width - 170, Math.max(8, mx - 60)) + "px";
        bTip.style.top = Math.max(8, my - 56) + "px";
        bTip.innerHTML = `<b>${hit.sector.name}</b>（${hit.sector.quad}）<br>成交 ${hit.sector.size} 億`;
        setTimeout(() => { bTip.style.display = "none"; }, 1800);
      }
    });

    const tCanvas = document.getElementById("thirtyCanvas"), tTip = document.getElementById("thirtyTip");
    tCanvas.addEventListener("click", e => {
      const r = tCanvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const hit = thirtyHits.find(h => Math.hypot(mx - h.px, my - h.py) <= 16);
      if (hit) {
        const gap = hit.v - hit.avg30;
        tTip.style.display = "block";
        tTip.style.left = Math.min(r.width - 190, Math.max(8, mx - 80)) + "px";
        tTip.style.top = Math.max(8, my - 54) + "px";
        tTip.innerHTML = `<b>${hit.i === CLOSE_30D.length - 1 ? "當天收盤 (11/20)" : "前" + (CLOSE_30D.length - 1 - hit.i) + "日收盤"}</b>：${hit.v.toFixed(2)}<br>較 30D 均價：${gap >= 0 ? "+" : ""}${gap.toFixed(2)}`;
        setTimeout(() => { tTip.style.display = "none"; }, 2200);
      }
    });
  }

  function downloadHtml() {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    a.click();
  }

  window.addEventListener("resize", () => { drawBubbles(); drawThirtyDay(); });
  setupEvents();
  drawBubbles();
  renderStocks();
  renderColorHeatList();
  drawThirtyDay();
</script>
</body>
</html>
