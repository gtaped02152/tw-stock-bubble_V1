<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>台股真實數據監控（直連 TWSE 30日歷史收盤 × 資金泡泡圖）</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --card: #162036;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
    }
    header {
      background: #0b1222;
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .top-bar { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .app-title { font-size: 0.95rem; font-weight: 800; }
    .status-pill {
      font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px;
      white-space: nowrap;
    }
    .pill-ok { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.45); }
    .pill-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.45); }
    .pill-wait { background: rgba(251, 191, 36, 0.18); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.45); }

    .close-box {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 8px; padding: 7px 10px; font-size: 0.82rem; font-variant-numeric: tabular-nums; gap: 6px;
    }
    .close-pts { font-size: 1.08rem; font-weight: 900; color: var(--gold); }
    .down { color: #34d399; font-weight: 700; }
    .up { color: #f87171; font-weight: 700; }
    .btn {
      background: var(--card); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.45);
      padding: 4px 10px; border-radius: 6px; font-size: 0.74rem; font-weight: 700; cursor: pointer;
    }

    .main { max-width: 900px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
    .card-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .box-title { font-size: 0.94rem; font-weight: 800; }
    .box-sub { font-size: 0.73rem; color: var(--muted); }
    .canvas-wrap {
      position: relative; width: 100%; height: 280px;
      background: radial-gradient(circle at 50% 45%, #131d33 0%, #080d18 100%);
      border-radius: 9px; border: 1px solid rgba(148, 163, 184, 0.15); overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .tip {
      position: absolute; pointer-events: none; background: rgba(9, 14, 26, 0.96);
      border: 1px solid rgba(251, 191, 36, 0.5); border-radius: 8px; padding: 7px 10px;
      font-size: 0.75rem; z-index: 25; display: none; max-width: 230px;
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      display: none;
    }
    .history-table-wrap { max-height: 220px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    th { text-align: left; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
    td { padding: 6px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); }
  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="top-row">
      <div class="app-title">TPE: IX0001 真實收盤與 30 日資料庫</div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="status-pill pill-wait" id="connPill">⏳ 連線 TWSE 中...</span>
        <button class="btn" onclick="loadRealTwse30Days()">重新抓取</button>
        <button class="btn" onclick="downloadHtml()">下載</button>
      </div>
    </div>
    <div class="close-box">
      <div>
        <span>最新收盤：</span>
        <span class="close-pts" id="latestCloseVal">讀取中...</span>
        <span id="latestCloseDiff"></span>
      </div>
      <div style="font-size:0.73rem; color:var(--muted);" id="latestDateText">資料來源：TWSE 官方 FMTQIK</div>
    </div>
  </div>
</header>

<div class="main">
  <div class="error-banner" id="errBanner"></div>

  <!-- 1. 當天收盤與前 30 個交易日真實收盤價比較圖（完整 XY 軸 + 30D 均價） -->
  <section class="card-box">
    <div>
      <div class="box-title">當天收盤與前 30 個交易日真實收盤比較（TWSE 官方數據）</div>
      <div class="box-sub" id="thirtyMeta">正在從證交所讀取近 30 個交易日加權指數收盤價...</div>
    </div>
    <div class="canvas-wrap" id="thirtyWrap">
      <canvas id="thirtyCanvas"></canvas>
      <div class="tip" id="thirtyTip"></div>
    </div>
    <!-- 同步列出這 30 天的真實日期與收盤價供你直接核對 -->
    <div class="history-table-wrap">
      <table>
        <thead>
          <tr>
            <th>交易日期 (民國)</th>
            <th>加權收盤指數</th>
            <th>漲跌點數</th>
            <th>成交金額 (億元)</th>
          </tr>
        </thead>
        <tbody id="historyRows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  // 優先嘗試本地 Python 轉發器 (零誤差)，若無則走公開 CORS 代理直抓 TWSE 官方 API
  const LOCAL_BRIDGE = "http://127.0.0.1:8000/api/twse-30d";

  let real30Days = []; // 存放 { dateStr, close, diff, turnoverBillion }
  let chartHits = [];

  function formatYearMonth(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, "0");
    return `${y}${m}01`;
  }

  async function fetchJsonWithFallback(twseUrl) {
    const proxies = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(twseUrl)}`,
      `https://corsproxy.io/?${encodeURIComponent(twseUrl)}`
    ];
    for (const url of proxies) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) continue;
        const data = await res.json();
        if (data && data.stat === "OK" && Array.isArray(data.data)) {
          return data.data;
        }
      } catch (e) {}
    }
    throw new Error("無法連線至證交所公開節點");
  }

  // 解析 TWSE FMTQIK 回傳列: [日期, 成交股數, 成交金額, 成交筆數, 發行量加權股價指數, 漲跌點數]
  function parseFmtqikRows(rows) {
    return rows.map(r => {
      const dateStr = String(r[0]).trim();
      const turnoverBillion = +(parseFloat(String(r[2]).replace(/,/g, "")) / 1e8).toFixed(1);
      const close = parseFloat(String(r[4]).replace(/,/g, ""));
      const diff = parseFloat(String(r[5]).replace(/,/g, ""));
      return { dateStr, close, diff, turnoverBillion };
    }).filter(item => !isNaN(item.close) && item.close > 0);
  }

  async function loadRealTwse30Days() {
    const pill = document.getElementById("connPill");
    const errBox = document.getElementById("errBanner");
    pill.className = "status-pill pill-wait";
    pill.textContent = "⏳ 抓取 TWSE 真實歷史中...";
    errBox.style.display = "none";

    try {
      // 1. 先嘗試本地無限制轉發器
      let records = null;
      try {
        const localRes = await fetch(LOCAL_BRIDGE, { cache: "no-store" });
        if (localRes.ok) {
          const json = await localRes.json();
          if (Array.isArray(json.records) && json.records.length > 0) {
            records = json.records;
          }
        }
      } catch (e) {}

      // 2. 若未開本地轉發器，直接向 TWSE 抓取「本月」與「上個月」及「前兩個月」真實日收盤，確保湊滿 30 個交易日
      if (!records) {
        const now = new Date();
        const m0 = new Date(now.getFullYear(), now.getMonth(), 1);
        const m1 = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const m2 = new Date(now.getFullYear(), now.getMonth() - 2, 1);

        const urls = [m2, m1, m0].map(d =>
          `https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?response=json&date=${formatYearMonth(d)}`
        );

        const results = await Promise.all(urls.map(u => fetchJsonWithFallback(u)));
        const merged = [];
        results.forEach(rows => {
          merged.push(...parseFmtqikRows(rows));
        });
        records = merged;
      }

      if (!records || records.length === 0) {
        throw new Error("TWSE 回傳空資料");
      }

      // 取最近 30 個真實交易日
      real30Days = records.slice(-30);
      const latest = real30Days[real30Days.length - 1];

      document.getElementById("latestCloseVal").textContent =
        latest.close.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      const diffEl = document.getElementById("latestCloseDiff");
      const prevClose = latest.close - latest.diff;
      const pct = prevClose ? (latest.diff / prevClose) * 100 : 0;
      diffEl.textContent = ` ${latest.diff >= 0 ? "+" : ""}${latest.diff.toFixed(2)} (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%)`;
      diffEl.className = latest.diff >= 0 ? "up" : "down";

      document.getElementById("latestDateText").textContent = `最新交易日：${latest.dateStr}（TWSE 官方實盤）`;
      pill.className = "status-pill pill-ok";
      pill.textContent = `✓ 已載入 ${real30Days.length} 日真實收盤`;

      renderHistoryTable();
      drawThirtyDayChart();
    } catch (err) {
      pill.className = "status-pill pill-err";
      pill.textContent = "✕ TWSE 連線受阻";
      errBox.style.display = "block";
      errBox.innerHTML = `
        <b>⚠️ 無法直接從瀏覽器抓到 TWSE 官方歷史資料（公開代理節點限流或跨域阻擋）：</b><br>
        為遵守「絕不用假資料取代」原則，圖表已停止繪製推估曲線。<br>
        請在電腦執行隨附的 <code>python twse_bridge.py</code>，即可 100% 直連證交所抓回真實 30 天收盤價與個股買賣超。
      `;
    }
  }

  function renderHistoryTable() {
    const tbody = document.getElementById("historyRows");
    tbody.innerHTML = real30Days.slice().reverse().map((r, i) => `
      <tr style="${i === 0 ? "background:rgba(251,191,36,0.12);" : ""}">
        <td><strong>${r.dateStr}</strong>${i === 0 ? " (最新)" : ""}</td>
        <td><strong>${r.close.toLocaleString("en-US", { minimumFractionDigits: 2 })}</strong></td>
        <td class="${r.diff >= 0 ? "up" : "down"}">${r.diff >= 0 ? "+" : ""}${r.diff.toFixed(2)}</td>
        <td>${r.turnoverBillion.toLocaleString("en-US")} 億</td>
      </tr>
    `).join("");
  }

  function drawThirtyDayChart() {
    if (real30Days.length === 0) return;
    const wrap = document.getElementById("thirtyWrap");
    const canvas = document.getElementById("thirtyCanvas");
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const closes = real30Days.map(d => d.close);
    const latestClose = closes[closes.length - 1];
    const avg30 = closes.reduce((a, b) => a + b, 0) / closes.length;
    const gap = latestClose - avg30;

    document.getElementById("thirtyMeta").textContent =
      `真實 30D 均價：${avg30.toFixed(2)} ｜ 當天收盤：${latestClose.toFixed(2)}（較 30D 均價 ${gap >= 0 ? "+" : ""}${gap.toFixed(2)} 點）`;

    const pad = { top: 24, right: 20, bottom: 32, left: 60 };
    const pw = w - pad.left - pad.right, ph = h - pad.top - pad.bottom;

    const minV = Math.floor((Math.min(...closes) - 400) / 500) * 500;
    const maxV = Math.ceil((Math.max(...closes) + 400) / 500) * 500;

    const toX = i => pad.left + (i / Math.max(1, closes.length - 1)) * pw;
    const toY = v => pad.top + ((maxV - v) / (maxV - minV)) * ph;

    // Y 軸網格與刻度
    for (let s = 0; s <= 4; s++) {
      const val = minV + ((maxV - minV) * s) / 4;
      const py = toY(val);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
      ctx.beginPath(); ctx.moveTo(pad.left, py); ctx.lineTo(w - pad.right, py); ctx.stroke();

      ctx.fillStyle = "#94a3b8"; ctx.font = "10.5px sans-serif"; ctx.textAlign = "right";
      ctx.fillText(Math.round(val).toLocaleString("en-US"), pad.left - 7, py + 3.5);
    }

    // X 軸日期刻度
    const step = Math.max(1, Math.floor((real30Days.length - 1) / 4));
    for (let idx = 0; idx < real30Days.length; idx += step) {
      drawXTick(ctx, idx, toX(idx), pad.top, h - pad.bottom, real30Days[idx].dateStr, false);
    }
    const lastIdx = real30Days.length - 1;
    drawXTick(ctx, lastIdx, toX(lastIdx), pad.top, h - pad.bottom, real30Days[lastIdx].dateStr, true);

    // 明確 XY 主軸線
    ctx.strokeStyle = "rgba(203, 213, 225, 0.6)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, h - pad.bottom);
    ctx.lineTo(w - pad.right, h - pad.bottom);
    ctx.stroke();

    // 30D 均價線
    const avgY = toY(avg30);
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(pad.left, avgY); ctx.lineTo(w - pad.right, avgY); ctx.stroke();
    ctx.restore();

    ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
    ctx.fillRect(pad.left + 6, avgY - 17, 134, 15);
    ctx.fillStyle = "#fde047"; ctx.font = "bold 10.5px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(`30D 均價 ${avg30.toFixed(2)}`, pad.left + 9, avgY - 6);

    // 收盤折線
    ctx.beginPath();
    closes.forEach((v, i) => {
      const px = toX(i), py = toY(v);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.2; ctx.stroke();

    chartHits = [];
    closes.forEach((v, i) => {
      const px = toX(i), py = toY(v);
      const isLast = i === lastIdx;
      ctx.beginPath(); ctx.arc(px, py, isLast ? 5.5 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = isLast ? "#f43f5e" : "#7dd3fc"; ctx.fill();

      if (isLast) {
        ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#fde047"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "right";
        ctx.fillText(`收盤 ${v.toFixed(2)}`, px - 8, py - 8);
      }
      chartHits.push({ item: real30Days[i], px, py, avg30 });
    });
  }

  function drawXTick(ctx, idx, px, topY, bottomY, dateStr, isLast) {
    ctx.strokeStyle = "rgba(148, 163, 184, 0.1)";
    ctx.beginPath(); ctx.moveTo(px, topY); ctx.lineTo(px, bottomY); ctx.stroke();
    ctx.fillStyle = isLast ? "#fbbf24" : "#94a3b8";
    ctx.font = isLast ? "bold 10px sans-serif" : "10px sans-serif";
    ctx.textAlign = "center";
    const shortDate = dateStr.split("/").slice(1).join("/");
    ctx.fillText(isLast ? `${shortDate}(收)` : shortDate, px, bottomY + 16);
  }

  const tCanvas = document.getElementById("thirtyCanvas"), tTip = document.getElementById("thirtyTip");
  tCanvas.addEventListener("click", e => {
    const r = tCanvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = chartHits.find(h => Math.hypot(mx - h.px, my - h.py) <= 16);
    if (hit) {
      const gap = hit.item.close - hit.avg30;
      tTip.style.display = "block";
      tTip.style.left = Math.min(r.width - 190, Math.max(8, mx - 80)) + "px";
      tTip.style.top = Math.max(8, my - 56) + "px";
      tTip.innerHTML = `<b>${hit.item.dateStr}</b>：${hit.item.close.toFixed(2)}<br>較 30D 均價：${gap >= 0 ? "+" : ""}${gap.toFixed(2)}`;
      setTimeout(() => { tTip.style.display = "none"; }, 2200);
    }
  });

  function downloadHtml() {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    a.click();
  }

  window.addEventListener("resize", drawThirtyDayChart);
  loadRealTwse30Days();
</script>
</body>
</html>
