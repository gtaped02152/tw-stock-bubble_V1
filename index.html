<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>台股資金泡泡圖（手機交易參考版）</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --card: #162036;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
    }

    /* 手機優先頂部收盤鎖定列 */
    header {
      background: #0b1222;
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .top-bar {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 0.98rem;
      font-weight: 800;
    }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .status-locked {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }
    .status-open {
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }

    .close-summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.84rem;
      font-variant-numeric: tabular-nums;
      gap: 6px;
    }

    .close-pts {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--gold);
    }

    .up { color: #f87171; font-weight: 700; }
    .down { color: #34d399; font-weight: 700; }

    .btn-dl {
      background: var(--card);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.45);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 手機單欄主容器 */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .box-head {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .box-title {
      font-size: 0.94rem;
      font-weight: 800;
    }

    .box-sub {
      font-size: 0.73rem;
      color: var(--muted);
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 340px;
      background: radial-gradient(circle at 50% 45%, #131d33 0%, #080d18 100%);
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      overflow: hidden;
    }

    canvas { width: 100%; height: 100%; display: block; }

    .tip {
      position: absolute;
      pointer-events: none;
      background: rgba(9, 14, 26, 0.96);
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.76rem;
      z-index: 25;
      display: none;
      max-width: 220px;
    }

    /* 大類橫向滑動選擇列（手機好點） */
    .sector-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .sector-scroll::-webkit-scrollbar { display: none; }

    .s-btn {
      flex: 0 0 auto;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .s-btn.active {
      background: rgba(251, 191, 36, 0.18);
      border-color: var(--gold);
      color: #fde68a;
    }

    /* 手機友善個股大戶/散戶卡片清單 */
    .stock-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .st-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .st-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .st-mid {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .force-bars {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .f-line {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
    }
    .f-track {
      flex: 1;
      height: 6px;
      background: #0b111e;
      border-radius: 99px;
      overflow: hidden;
    }
    .f-big { height: 100%; background: #f43f5e; }
    .f-ret { height: 100%; background: #38bdf8; }

    /* 簡潔純色版：主力買超／賣超圖（越紅買超越大、越綠賣超越大） */
    .color-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 2px 0;
    }
    .grad-bar {
      flex: 1;
      height: 8px;
      margin: 0 8px;
      border-radius: 99px;
      background: linear-gradient(90deg, #065f46 0%, #10b981 25%, #1e293b 50%, #ef4444 75%, #991b1b 100%);
    }

    .heat-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .heat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .heat-name {
      width: 96px;
      flex: 0 0 96px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heat-slots {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
    }

    .slot-block {
      height: 20px;
      border-radius: 4px;
    }
  </style>
</head>

  // 僅用顏色表達買超（越紅越大）與賣超（越綠越大）
  function scoreToColor(score) {
    if (score >= 85) return "#991b1b";
    if (score >= 55) return "#dc2626";
    if (score >= 25) return "#ef4444";
    if (score > 5)   return "#f87171";
    if (score >= -5) return "#334155";
    if (score > -25) return "#34d399";
    if (score > -55) return "#10b981";
    if (score > -85) return "#059669";
    return "#065f46";
  }

  function drawBubbles() {
    const wrap = document.getElementById("bubbleWrap");
    const canvas = document.getElementById("bubbleCanvas");
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const pad = { top: 24, right: 18, bottom: 26, left: 42 };
    const pw = w - pad.left - pad.right;
    const ph = h - pad.top - pad.bottom;

    const minX = -105, maxX = 200;
    const minY = -140, maxY = 220;
    const toX = v => pad.left + ((v - minX) / (maxX - minX)) * pw;
    const toY = v => pad.top + ((maxY - v) / (maxY - minY)) * ph;
    const zx = toX(0);
    const zy = toY(0);

    ctx.fillStyle = "rgba(244, 63, 94, 0.07)";
    ctx.fillRect(zx, pad.top, w - pad.right - zx, zy - pad.top);
    ctx.fillStyle = "rgba(245, 158, 11, 0.06)";
    ctx.fillRect(zx, zy, w - pad.right - zx, h - pad.bottom - zy);
    ctx.fillStyle = "rgba(56, 189, 248, 0.06)";
    ctx.fillRect(pad.left, pad.top, zx - pad.left, zy - pad.top);
    ctx.fillStyle = "rgba(100, 116, 139, 0.06)";
    ctx.fillRect(pad.left, zy, zx - pad.left, h - pad.bottom - zy);

    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(251, 191, 36, 0.55)";
    ctx.beginPath(); ctx.moveTo(zx, pad.top); ctx.lineTo(zx, h - pad.bottom); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.left, zy); ctx.lineTo(w - pad.right, zy); ctx.stroke();
    ctx.restore();

    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillStyle = "#fb7185"; ctx.fillText("主力主動流入", w - pad.right - 6, pad.top + 14);
    ctx.fillStyle = "#fbbf24"; ctx.fillText("輪動", w - pad.right - 6, h - pad.bottom - 6);
    ctx.textAlign = "left";
    ctx.fillStyle = "#38bdf8"; ctx.fillText("觀望", pad.left + 6, pad.top + 14);
    ctx.fillStyle = "#94a3b8"; ctx.fillText("退潮", pad.left + 6, h - pad.bottom - 6);

    bubbleHits = [];
    SECTORS.forEach(s => {
      const cx = toX(s.x);
      const cy = toY(s.y);
      const r = Math.max(17, Math.min(42, Math.sqrt(s.size) * 0.82));
      const isSel = s.id === selectedId;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = s.color + "bb";
      ctx.fill();
      ctx.lineWidth = isSel ? 3 : 1.4;
      ctx.strokeStyle = isSel ? "#fde047" : s.color;
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 10.5px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(s.name, cx, cy - 1);
      ctx.fillStyle = "#fef08a";
      ctx.font = "9.5px sans-serif";
      ctx.fillText(s.size + "億", cx, cy + 11);

      bubbleHits.push({ sector: s, cx, cy, r });
    });
  }

    const sec = SECTORS.find(s => s.id === selectedId) || SECTORS[0];
    document.getElementById("stockCards").innerHTML = sec.stocks.map(st => {
      const isUp = !st.chg.startsWith("-");
      return `
        <div class="st-item">
          <div class="st-top">
            <span>${st.code} ${st.name}</span>
            <span>${st.close.toFixed(2)} <span class="${isUp ? "up" : "down"}">${st.chg}</span></span>
          </div>
          <div class="st-mid">
            <span>成交：${st.amt}億</span>
            <span>大戶：<b class="${st.big.startsWith("+") ? "up" : "down"}">${st.big}</b></span>
            <span>散戶：<b class="${st.retail.startsWith("+") ? "up" : "down"}">${st.retail}</b></span>
          </div>
          <div class="force-bars">
            <div class="f-line">
              <span style="width:28px; color:#fda4af;">大戶</span>
              <div class="f-track"><div class="f-big" style="width:${st.bigPct}%"></div></div>
              <span>${st.bigPct}%</span>
            </div>
            <div class="f-line">
              <span style="width:28px; color:#7dd3fc;">散戶</span>
              <div class="f-track"><div class="f-ret" style="width:${st.retPct}%"></div></div>
              <span>${st.retPct}%</span>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderColorHeatList() {
    const container = document.getElementById("heatList");
    container.innerHTML = SECTORS.map(s => {
      const blocks = s.flow5mColorScore.map(sc => {
        const bg = scoreToColor(sc);
        return `<div class="slot-block" style="background:${bg};"></div>`;
      }).join("");
      return `
        <div class="heat-row" onclick="selectSector('${s.id}')">
          <div class="heat-name">${s.name}</div>
          <div class="heat-slots">${blocks}</div>
        </div>
      `;
    }).join("");
  }

  function drawThirtyDay() {
    const wrap = document.getElementById("thirtyWrap");
    const canvas = document.getElementById("thirtyCanvas");
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const pad = { top: 22, right: 18, bottom: 26, left: 54 };
    const pw = w - pad.left - pad.right;
    const ph = h - pad.top - pad.bottom;

    const minV = Math.min(...CLOSE_30D) - 150;
    const maxV = Math.max(...CLOSE_30D) + 150;
    const avg30 = CLOSE_30D.reduce((a, b) => a + b, 0) / CLOSE_30D.length;

    document.getElementById("thirtyInfo").textContent =
      `30日均價 ${avg30.toFixed(0)} ｜ 當天收盤 ${CLOSE_INDEX.toFixed(2)}`;

    const toX = i => pad.left + (i / (CLOSE_30D.length - 1)) * pw;
    const toY = v => pad.top + ((maxV - v) / (maxV - minV)) * ph;

    // 30日均線
    const avgY = toY(avg30);
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(251, 191, 36, 0.65)";
    ctx.beginPath(); ctx.moveTo(pad.left, avgY); ctx.lineTo(w - pad.right, avgY); ctx.stroke();
    ctx.restore();

    // 折線
    ctx.beginPath();
    CLOSE_30D.forEach((v, i) => {
      const px = toX(i);
      const py = toY(v);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.2;
    ctx.stroke();

    thirtyHits = [];
    CLOSE_30D.forEach((v, i) => {
      const px = toX(i);
      const py = toY(v);
      const isLast = i === CLOSE_30D.length - 1;
      if (isLast) {
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#fbbf24";
        ctx.fill();
        ctx.fillStyle = "#fde047";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`收 ${v.toFixed(2)}`, px - 8, py - 7);
      }
      if (i === 0 || i === 15 || isLast) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(isLast ? "當天" : `-${CLOSE_30D.length - 1 - i}日`, px, h - 8);
      }
      thirtyHits.push({ i, v, px, py });
    });
  }

  function selectSector(id) {
    selectedId = id;
    drawBubbles();
    renderStocks();
  }

  function setupEvents() {
    const bCanvas = document.getElementById("bubbleCanvas");
    const bTip = document.getElementById("bubbleTip");
    bCanvas.addEventListener("click", e => {
      const r = bCanvas.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      const hit = bubbleHits.slice().reverse().find(h => Math.hypot(mx - h.cx, my - h.cy) <= h.r);
      if (hit) {
        selectSector(hit.sector.id);
        bTip.style.display = "block";
        bTip.style.left = Math.min(r.width - 170, Math.max(8, mx - 60)) + "px";
        bTip.style.top = Math.max(8, my - 58) + "px";
        bTip.innerHTML = `<b>${hit.sector.name}</b>（${hit.sector.quad}）<br>成交 ${hit.sector.size} 億`;
        setTimeout(() => { bTip.style.display = "none"; }, 1800);
      }
    });

    const tCanvas = document.getElementById("thirtyCanvas");
    const tTip = document.getElementById("thirtyTip");
    tCanvas.addEventListener("click", e => {
      const r = tCanvas.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      const hit = thirtyHits.find(h => Math.hypot(mx - h.px, my - h.py) <= 16);
      if (hit) {
        tTip.style.display = "block";
        tTip.style.left = Math.min(r.width - 170, Math.max(8, mx - 60)) + "px";
        tTip.style.top = Math.max(8, my - 46) + "px";
        tTip.innerHTML = `${hit.i === CLOSE_30D.length - 1 ? "當天收盤" : "前" + (CLOSE_30D.length - 1 - hit.i) + "日"}：<b>${hit.v.toFixed(2)}</b>`;
        setTimeout(() => { tTip.style.display = "none"; }, 1800);
      }
    });
  }

  function downloadHtml() {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    a.click();
  }

  // 收盤時間鎖定狀態（非交易時段絕不亂跳）
  const badge = document.getElementById("marketBadge");
  if (isTradingTime()) {
    badge.className = "status-pill status-open";
    badge.textContent = "🟢 盤中交易中";
  } else {
    badge.className = "status-pill status-locked";
    badge.textContent = "🔒 已收盤·鎖定";
  }

  window.addEventListener("resize", () => {
    drawBubbles();
    drawThirtyDay();
  });

  setupEvents();
  drawBubbles();
  renderStocks();
  renderColorHeatList();
  drawThirtyDay();
</script>
</body>
</html>
